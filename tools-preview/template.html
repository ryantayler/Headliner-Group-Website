<meta charset="utf-8">
<title>Headliner Group</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/*__FONTS__*/
/*__NVFONTS__*/
/*__CSS__*/

/* preview shell only. the real site is five separate documents. */

/* The view switch, far top right, above both views. */
.vt{position:fixed;top:12px;right:12px;z-index:2147483000;display:flex;padding:4px;gap:2px;border-radius:100px;
  background:rgba(14,14,14,.86);border:1px solid rgba(236,232,224,.18);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.vt button{all:unset;cursor:pointer;padding:8px 13px;border-radius:100px;font:600 12.5px/1 'Inter',system-ui,sans-serif;color:#C9C5BE;white-space:nowrap}
.vt button[aria-pressed="true"]{background:#ECE8E0;color:#0A0A0A}
.vt button:focus-visible{outline:2px solid #2DE2C3;outline-offset:2px}
body.is-new{background:#0A0A0A}
@media (max-width:520px){.vt__x{display:none}}
/* on a phone the switch would sit on the burger, so the current view's bar drops below it */
@media (max-width:900px){body:not(.is-new) .hdr{top:52px}}
[hidden]{display:none !important}
.pg{display:block}
</style>

<header class="hdr">
  <div class="shell hdr__in">
    <a class="hl-link" href="#index" data-pg="index" aria-label="Headliner Group, home"><div class="hl-stage"><div class="hl-logo"><div class="hl-beam"></div><span class="hl-word">Headliner</span><div class="hl-group">Group</div></div></div></a>
    <nav class="nav" id="nav" aria-label="Main">
      <!--__NAV__-->
      <a class="btn btn--fill" href="#contact" data-pg="contact">Let&rsquo;s chat</a>
    </nav>
    <button class="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav"><span></span></button>
  </div>
</header>

<div class="vt" role="group" aria-label="Choose a view">
  <button type="button" data-view="old" aria-pressed="true">Current<span class="vt__x"> view</span></button>
  <button type="button" data-view="new" aria-pressed="false">New<span class="vt__x"> view</span></button>
</div>

<main id="app">
<!--__BODIES__-->
</main>

<!--__FOOTER__-->

<script>
(function(){
  var hdr=document.querySelector('.hdr'), nav=document.querySelector('.nav'),
      burger=document.querySelector('.burger'), io=null;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  function reveal(page){
    if(io) io.disconnect();
    var items=page.querySelectorAll('.rv');
    if(reduce||!('IntersectionObserver' in window)){
      items.forEach(function(e){e.classList.add('is-in')}); return;
    }
    items.forEach(function(e){e.classList.remove('is-in')});
    io=new IntersectionObserver(function(en){
      en.forEach(function(x){ if(x.isIntersecting){x.target.classList.add('is-in'); io.unobserve(x.target);} });
    },{rootMargin:'0px 0px -8% 0px',threshold:.08});
    items.forEach(function(e){io.observe(e)});
  }

  function show(name,push){
    var found=null;
    document.querySelectorAll('.pg').forEach(function(p){
      var on=p.dataset.pg===name; p.hidden=!on; if(on) found=p;
    });
    if(!found){ return show('index',push); }
    // the preview's own way in to the hidden pages, on Home only
    document.querySelectorAll('.pv-only').forEach(function(x){ x.hidden = name!=='index'; });
    // Ryan's page runs his own colours. The header and footer follow it.
    document.body.classList.toggle('theme-ryan', name==='ryan');
    document.querySelectorAll('[data-pg]').forEach(function(a){
      if(a.classList.contains('btn')||a.classList.contains('wordmark')) return;
      a.classList.toggle('is-here', a.dataset.pg===name);
    });
    scrollTo(0,0);
    onScroll();
    reveal(found);
    if(push) history.replaceState(null,'','#'+name);
  }

  document.addEventListener('click',function(e){
    var a=e.target.closest('a'); if(!a) return;
    var pg=a.dataset.pg;
    if(!pg){
      var h=a.getAttribute('href')||'';
      var m=h.match(/^([a-z0-9-]+)\.html$/); if(m) pg=m[1];
    }
    if(!pg) return;
    e.preventDefault();
    var sh=document.getElementById('sheet');
    if(sh&&!sh.hidden){ sh.hidden=true; document.body.classList.remove('sheet-open'); }
    if(nav.classList.contains('is-open')) burger.click();
    show(pg,true);
  });

  function onScroll(){ hdr.classList.toggle('is-stuck', scrollY>24); }
  addEventListener('scroll',onScroll,{passive:true});

  burger.addEventListener('click',function(){
    var open=nav.classList.toggle('is-open');
    hdr.classList.toggle('is-open',open);
    burger.setAttribute('aria-expanded',String(open));
    document.body.style.overflow=open?'hidden':'';
  });

  document.addEventListener('submit',function(e){
    var f=e.target.closest('form[data-demo],form[data-newsletter]'); if(!f) return; /* the preview never posts anywhere */
    e.preventDefault();
    var msg=f.querySelector('.formmsg'); if(msg) msg.classList.add('is-on');
    f.querySelectorAll('input,textarea,select').forEach(function(x){ if(x.type!=='submit') x.value=''; });
  });

  show((location.hash||'#index').slice(1),false);
  window.__pvShow=show;

/*__WALL__*/
})();
</script>

<template id="nv-src">
<!--__NEXT__-->
</template>

<script>
/* The new view mounts in a shadow root, so the site's stylesheet cannot reach it and
   its stylesheet cannot reach the site. The switch remembers the last choice. */
(function(){
  var src=document.getElementById('nv-src'); if(!src||!document.body.attachShadow) return;
  var host=document.createElement('div'); host.id='nv-host'; host.hidden=true;
  document.body.insertBefore(host, document.querySelector('.vt').nextSibling);
  var root=host.attachShadow({mode:'open'}), frag=src.content.cloneNode(true);
  var sc=frag.querySelector('script[data-nv]'), code=sc?sc.textContent:''; if(sc) sc.remove();
  root.appendChild(frag);
  try{ (new Function(code)).call(root); }catch(e){ console.error('new view', e); }
  var old=[document.querySelector('body > .hdr'), document.getElementById('app'), document.querySelector('body > .ftr')];
  var btns=document.querySelectorAll('.vt [data-view]');
  function page(){ return (location.hash||'#index').slice(1)||'index'; }
  function set(v, remember){
    var isNew=v==='new', at=page();
    host.hidden=!isNew; old.forEach(function(e){ if(e) e.hidden=isNew; });
    document.body.classList.toggle('is-new', isNew);
    btns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.view===v)); });
    if(isNew && host.nvShow) host.nvShow(at); else if(!isNew && window.__pvShow) window.__pvShow(at,true);
    scrollTo(0,0);
    if(remember){ try{ localStorage.setItem('hl-view', v); }catch(e){} }
  }
  btns.forEach(function(b){ b.addEventListener('click', function(){ set(b.dataset.view, true); }); });
  var saved='old'; try{ saved=localStorage.getItem('hl-view')||'old'; }catch(e){}
  if(saved==='new') set('new', false);
})();
</script>
