<style>
:host{all:initial;display:block}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}

.nv{
  --bg:#F2F4F3; --bg2:#E7EBE9; --card:#FFFFFF; --fg:#111614; --sub:#3F4744; --mute:#5B6360;
  --rim:#D7DDDA; --acc:#2DE2C3; --acc-rgb:45,226,195; --acc-t:#0A7261;
  --cta:#FF5A36; --cta-h:#FF7455; --cta-ink:#0A0A0A;
  --black:#0A0A0A; --light:#ECE8E0;
  --display:'Archivo Black',Impact,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut:clamp(20px,4.4vw,64px);
  --e:clamp(36px,5vw,84px);
  --out:cubic-bezier(.16,1,.3,1);
  position:relative;min-height:100vh;background:var(--bg);color:var(--fg);
  font:400 clamp(16px,.25vw + 15px,18px)/1.6 var(--body);
  -webkit-font-smoothing:antialiased;overflow-x:clip;
}
.nv.is-ryan{
  --bg:#0A0A0A; --bg2:#121212; --card:#161616; --fg:#ECE8E0; --sub:#C9C5BE; --mute:#8E8A84;
  --rim:#2A2A2A; --acc:#FF2D6B; --acc-rgb:255,45,107; --acc-t:#FF2D6B;
  --cta:#FF2D6B; --cta-h:#FF5586; --cta-ink:#0A0A0A;
  --display:'Anton',Impact,sans-serif;
}
:where(.nv) a{color:inherit}
:where(.nv) :is(button,input,select,textarea){font:inherit;color:inherit}
.nv img{display:block;max-width:100%}
.nv :focus-visible{outline:2px solid var(--acc-t);outline-offset:3px;border-radius:6px}
/* selecting text picks up the house colour: aqua on Headliner, pink on Ryan's page */
.nv ::selection{background:#2DE2C3;color:#0A0A0A}
.nv.is-ryan ::selection{background:#FF2D6B;color:#0A0A0A}
.wrap{width:min(1320px,100%);margin:0 auto;padding:0 var(--gut);position:relative;z-index:1}

/* ---------- type: one heading layout everywhere ---------- */
.d{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:-.025em;line-height:.92;margin:0}
.is-ryan .d{letter-spacing:0;line-height:.95}
.d1{font-size:clamp(42px,6.6vw,112px);max-width:15ch}
.d2{font-size:clamp(36px,5vw,80px);max-width:17ch}
.d3{font-size:clamp(22px,2vw,30px);line-height:1}
.sh{margin-bottom:clamp(40px,5vw,72px)}
.pre{margin:0 0 10px;font:500 clamp(12.5px,.95vw,14.5px)/1 var(--body);letter-spacing:.02em;color:var(--mute)}
.sh .p,.sh .lead{margin-top:clamp(18px,2vw,28px)}
.lead{font:500 clamp(20px,1.7vw,26px)/1.4 var(--body);letter-spacing:-.015em;margin:0;max-width:40ch}
.p{color:var(--sub);max-width:62ch;margin:0}
.wants{list-style:none;padding:0 0 0 clamp(20px,2vw,28px);display:grid;gap:7px}
.wants li{display:flex;align-items:center;gap:14px}
.wants li::before{content:"";flex:none;width:18px;height:3px;border-radius:2px;background:#0A7261}
.p + .p{margin-top:1em}
.small{font-size:14px;color:var(--mute);margin:0}
.tm{font-family:var(--body);font-size:.3em;vertical-align:super;letter-spacing:0}

.wd{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.wi{display:inline-block;translate:0 108%;transition:translate 1.1s var(--out);transition-delay:calc(var(--i,0) * 40ms)}
.up .wi{translate:0 0}
.fade{opacity:0;translate:0 24px;transition:opacity 1s var(--out),translate 1.2s var(--out)}
.fade.up{opacity:1;translate:0 0}

/* pictures: a slight zoom and drift the whole time they are on screen */
.px{overflow:hidden;background:var(--bg2)}
.px img{width:100%;height:100%;object-fit:cover;scale:1.12;translate:0 var(--d,0px);will-change:translate}

/* ---------- buttons, the site's own: orange to act, outline for the rest ---------- */
.btn{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:54px;padding:0 26px;border-radius:100px;border:1px solid currentColor;background:transparent;color:var(--fg);
  font:500 15px/1 var(--body);text-decoration:none;cursor:pointer;transition:color .45s var(--out),border-color .45s,background .45s;white-space:nowrap}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--fg);translate:0 101%;transition:translate .5s var(--out)}
.btn:hover{color:var(--bg)}
.btn:hover::before{translate:0 0}
.btn--go{background:var(--cta);border-color:var(--cta);color:var(--cta-ink);
  box-shadow:inset 0 0 14px 1px rgba(0,0,0,.28)}
.btn--go::before{background:var(--cta-h)}
.btn--go:hover{color:var(--cta-ink);border-color:var(--cta-h)}
.btn svg{width:18px;height:18px;fill:currentColor}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.link{font-weight:500;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px}

/* ---------- the logo lockup, the site's own, beam and all ---------- */
.hl-logo{position:relative;display:inline-block;font-size:44px;line-height:normal;-webkit-font-smoothing:auto;--ink:#ECE8E0;--sub:#ADA9A3;--beam:45,226,195}
.hl-word{font-family:'Archivo Black',Impact,sans-serif;font-size:1.3em;line-height:1;letter-spacing:-.01em;text-transform:uppercase;color:var(--ink);display:block;white-space:nowrap;position:relative;z-index:2}
.hl-group{font-family:'Inter',sans-serif;font-weight:600;font-size:.3835em;letter-spacing:.42em;text-transform:uppercase;color:var(--sub);text-align:right;margin:2px -.42em 0 0;position:relative;z-index:2}
.hl-beam{position:absolute;top:.5em;left:50%;width:4.545em;height:20.455em;margin:-10.227em 0 0 -2.273em;transform:translate(-3.864em,-.682em) rotate(34deg);
  clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);background:linear-gradient(to bottom,rgba(var(--beam),.9),rgba(var(--beam),.16) 55%,rgba(var(--beam),0));
  filter:blur(.591em);mix-blend-mode:screen;pointer-events:none;z-index:0}
.hl-stage{position:absolute;top:0;left:0;overflow:hidden;font-size:44px;width:18em;height:5.9em;display:flex;align-items:center;justify-content:flex-end;padding-right:3.05em;
  transform-origin:left top;transform:scale(.36);
  --m:linear-gradient(to bottom,transparent 0,#000 12%,#000 78%,transparent 100%);-webkit-mask-image:var(--m);mask-image:var(--m)}
.hl-stage .hl-logo{font-size:1em}
.hl-link{display:block;flex:none;position:relative;width:285px;height:94px;margin-left:max(-60px,calc(var(--gut) * -1))}

/* ---------- bar: dark, like the site's own header ---------- */
.bar{position:fixed;inset:0 0 auto 0;z-index:40;height:94px;display:flex;align-items:center;color:#ECE8E0;transition:background .4s,translate .5s var(--out),height .4s}
/* over a hero photograph it carries a soft dark wash so the links stay readable */
.bar::before{content:"";position:absolute;inset:0 0 -40px 0;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,rgba(10,10,10,.72),rgba(10,10,10,.38) 60%,rgba(10,10,10,0));transition:opacity .4s}
.bar.is-solid::before{opacity:0}
.plate{position:relative;display:flex;align-items:center;padding:0 22px;height:46px;border-radius:8px;
  background:none;border:0}
.plate--go{padding:0;height:auto;border-radius:30px;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.bar .wrap{display:flex;align-items:center;gap:28px;padding-right:max(var(--gut),calc(236px - (100vw - min(1320px,100vw)) / 2))}
.bar.is-solid{background:rgba(10,10,10,.88);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);box-shadow:0 1px 0 #2E2E2E}
.bar.is-hid{translate:0 -100%}
.links{display:flex;gap:26px;margin-left:auto}
.links a{position:relative;font:500 15px/1 var(--body);text-decoration:none;padding:8px 0;color:#C9C5BE;transition:color .3s}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1.5px;background:#ECE8E0;scale:0 1;transform-origin:right;transition:scale .5s var(--out)}
.links a:hover,.links a.is-here{color:#ECE8E0}
.links a:hover::after,.links a.is-here::after{scale:1 1;transform-origin:left}
.bar .btn{height:44px;padding:0 20px;font-size:14px}
.menu{display:none;margin-left:auto;margin-right:150px;width:44px;height:44px;border-radius:50%;border:1px solid #2E2E2E;background:rgba(10,10,10,.6);cursor:pointer}
.menu span,.menu span::before{display:block;width:16px;height:1.5px;background:#ECE8E0;margin:auto;position:relative}
.menu span{translate:0 -3px}.menu span::before{content:"";position:absolute;top:6px}
.drawer{position:fixed;inset:0;z-index:39;background:var(--black);color:#ECE8E0;display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(10px,1.6vh,16px);
  padding:0 var(--gut) 48px;clip-path:polygon(0 0,100% 0,100% 0,0 0);transition:clip-path .8s var(--out)}
.drawer.is-open{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.drawer a{font:400 clamp(30px,8.6vw,72px)/1 var(--display);text-transform:uppercase;text-decoration:none;white-space:nowrap}
.drawer a.is-here{color:var(--acc)}
@media (max-width:960px){.links,.bar .btn,.plate--go,.is-ryan .bar .links.rt-links{display:none}.bar .wrap{padding-right:var(--gut)}.menu{display:block;margin:0;position:absolute;right:var(--gut);top:50%;translate:0 -50%}.hl-link{width:206px;height:68px}.hl-stage{transform:scale(.26)}}

/* page change: a panel cut on the beam's angle carries the next page's name */
/* The panel is a cone of light from a lamp far off to the right: its edges close in
   towards the lamp, and it swings up across the screen from below and out over the top,
   pivoting on that far point. */
.curtain{position:fixed;left:-15%;right:-15%;top:-45%;bottom:-45%;z-index:80;color:#ECE8E0;display:grid;place-items:center;
  filter:drop-shadow(0 0 10px rgba(45,226,195,.8)) drop-shadow(0 0 46px rgba(45,226,195,.5)) drop-shadow(0 0 120px rgba(45,226,195,.3));transform-origin:320% 50%;pointer-events:none;visibility:hidden}
/* the rim is the cone in aqua, the shape is the cone in black set a little inside it */
.curtain__r,.curtain__s{position:absolute;inset:0;clip-path:polygon(0 0,100% 22%,100% 78%,0 100%)}
.curtain__r{background:linear-gradient(90deg,#2DE2C3,rgba(45,226,195,.75))}
.curtain__s{inset:12px 0;background:var(--black)}
.curtain span{position:relative}
/* going Home the panel carries the lockup instead of a word */
.curtain__home{position:absolute;inset:0;display:none;place-items:center}
.curtain.to-home .curtain__home{display:grid;animation:homeIn .7s var(--out) both}
@keyframes homeIn{from{opacity:0;translate:0 30px}to{opacity:1;translate:0 0}}
.curtain__home .hl-stage{position:relative;transform:none;font-size:clamp(20px,3.4vw,50px);justify-content:center;padding-right:0}
/* Going to Ryan's page it is his pink instead: a straight edge rises from the bottom, holds on his signature, and carries on off the top */
.curtain.pinkc{left:0;right:0;top:0;bottom:0;color:#0A0A0A;transform-origin:50% 50%;
  filter:drop-shadow(0 0 22px rgba(255,45,107,.9)) drop-shadow(0 0 90px rgba(255,45,107,.5))}
.curtain.pinkc .curtain__r{display:none}
.curtain.pinkc .curtain__s{inset:0;clip-path:inset(100% 0 0 0);
  background:radial-gradient(120% 90% at 50% 50%,#FF2D6B 0,#FF2D6B 45%,#C81E52 100%)}
.curtain__sig{position:relative;display:none;width:min(560px,74vw);color:#0A0A0A}
.curtain__sig svg{width:100%;height:auto;fill:currentColor;display:block}
.curtain.pinkc.to-ryan .curtain__sig{display:block}
.curtain.pinkc.to-ryan span{display:none}
.curtain.pinkc span{font-family:'Archivo Black',Impact,sans-serif}
.curtain span{font:400 clamp(40px,8vw,120px)/1 var(--display);text-transform:uppercase;letter-spacing:-.02em;opacity:0;translate:0 30px;transition:opacity .4s,translate .6s var(--out)}
.curtain.on span{opacity:1;translate:0 0}
.curtain__sig{opacity:0;transition:opacity .4s}.curtain.on .curtain__sig{opacity:1}
.curtain.to-ryan .curtain__sig{--k:.4}

/* ---------- sections ---------- */
.sec{position:relative;z-index:2;padding:clamp(96px,11vw,160px) 0;background:var(--bg)}
.white{background:var(--card)}
.even{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,56px)}
@media (max-width:900px){.even{grid-template-columns:1fr}}

/* A dark section is a beam across the page: its top edge falls to the left and its
   bottom edge rises to the left, so the two cuts open out like a cone. It sits over the
   sections either side, which reach in under its cuts. */
.dk{background:var(--black);color:#ECE8E0;z-index:3;overflow:hidden;
  margin:calc(var(--e) * -1) 0;padding:calc(clamp(96px,11vw,160px) + var(--e)) 0;
  clip-path:polygon(0 var(--e),100% calc(var(--e) - var(--et,0px)),100% calc(100% - var(--e) + var(--eb,0px)),0 calc(100% - var(--e)));
  --fg:#ECE8E0;--sub:#B9B5AE;--mute:#8E8A84;--rim:#2A2A2A;--card:#141414;--bg:#0A0A0A;--bg2:#161616}
.ends-dark .foot{margin-top:0;clip-path:none;padding-top:clamp(64px,8vw,112px);border-top:1px solid #1C1C1C}
.dk:last-child{margin-bottom:0;padding-bottom:clamp(96px,11vw,160px);clip-path:polygon(0 var(--e),100% calc(var(--e) - var(--et,0px)),100% 100%,0 100%)}
/* a lighter band: a second cut above the method heading, tipping the other way,
   on a slightly deeper paper so the two tones read against each other */
.lt{background:var(--bg2);margin-top:calc(var(--e) * -1);
  padding-top:calc(clamp(96px,11vw,160px) + var(--e));
  clip-path:polygon(0 calc(var(--e) - var(--et,0px)),100% var(--e),100% 100%,0 100%)}
/* its light: one angled shaft that sweeps in from the left, idles, then swings off to the right */
.dk::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(var(--ba,118deg),transparent calc(6% + var(--bo,0%)),rgba(45,226,195,.30) calc(20% + var(--bo,0%)),rgba(45,226,195,.07) calc(38% + var(--bo,0%)),transparent calc(50% + var(--bo,0%)))}
.dk + .sec{padding-top:calc(clamp(96px,11vw,160px) + var(--e))}

/* a card on a dark section is solid, so the shaft runs behind it, and its top right
   rim catches the light as the shaft passes */
.glint{position:relative;isolation:isolate}
.glint::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1.5px;z-index:2;
  background:radial-gradient(120% 90% at var(--gx,100%) 0,rgba(45,226,195,calc(var(--g,0) * .95)),rgba(45,226,195,calc(var(--g,0) * .25)) 35%,transparent 62%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glint{box-shadow:14px -14px 40px -24px rgba(45,226,195,calc(var(--g,0) * .55)),inset -22px 22px 44px -30px rgba(45,226,195,calc(var(--g,0) * .22))}

/* ---------- hero: the photograph, the scrim and the swaying lamp ---------- */
.hero{position:relative;z-index:1;height:100svh;min-height:560px;overflow:hidden;background:var(--black);color:#ECE8E0;
  --fg:#ECE8E0;--sub:#C9C5BE;--mute:#8E8A84;--bg:#0A0A0A}
/* everything in the hero moves at half the scroll, so the next section slides over it */

  clip-path:polygon(0 var(--e),100% calc(var(--e) - var(--et,0px)),100% 100%,0 100%)}

.lamp{position:absolute;z-index:1;top:-330px;right:-342px;width:508px;height:1980px;transform-origin:top center;filter:blur(57px);pointer-events:none;
  transform:rotate(var(--la,34deg))}

  background:linear-gradient(to bottom,rgba(45,226,195,.46),rgba(45,226,195,.1) 55%,rgba(45,226,195,0))}
.hero .lead{margin-top:26px;color:#ECE8E0}

/* home: the lockup above the heading, and the heading on the live site's three lines */

/* the header's own stage at a bigger size, pulled left so the word lines up with the heading */

/* the home lockup in flight between the hero and the header */

/* phone: the written lines hold, sized so live events & production fits on one, and

/* phone: the hero reads centred, and the home lockup starts at the top centre, then
   flies up into the bar's corner as you scroll */
@media (max-width:620px){
  .hero__in{align-items:stretch;text-align:center;padding-top:0}

}

/* the section a hero hands over to fills the screen and holds its content in the middle,

  padding-top:calc(var(--e) + 72px);padding-bottom:72px}

/* ---------- home: the problem ---------- */

/* three mini quotes, expensive to cheap. The cheap one gets signed, and once you scroll on

.quotes{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.8vw,24px);align-items:end}

.qd__p{position:relative;width:100%;aspect-ratio:3/4;background:#fff;border-radius:10px;padding:14% 13% 0;display:flex;flex-direction:column;gap:7%;
  box-shadow:0 26px 44px -24px rgba(10,30,26,.4),0 0 0 1px var(--rim)}

.qd__sig path{fill:none;stroke:#1C3FB7;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset 1.3s .95s cubic-bezier(.5,0,.3,1)}

.qd > span{font:600 12.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

  transition:opacity .25s,scale .55s cubic-bezier(.2,1.5,.4,1)}

/* the two levers on the beam */

.start{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:14px;padding:22px 26px;border-radius:20px;border:1.5px dashed var(--rim)}
.a-bars{position:absolute;inset:28px 28px 30px;display:flex;align-items:flex-end;gap:12px}

.on .a-deal span:nth-child(1){translate:45% -50%;opacity:0}.on .a-deal span:nth-child(2){translate:-45% -50%;opacity:0}

/* the businesses Ryan has partnered with, as a quiet row of marks; no label on purpose */
.quote{margin:clamp(40px,5vw,72px) 0 0;max-width:900px}

.quote--c{display:flex;align-items:center;justify-content:center;gap:clamp(24px,3vw,48px);max-width:1040px;margin-inline:auto}

.quote blockquote .mark{color:#0A0A0A;background-size:100% 100%}

/* founder */

/* ---------- the call to book, on the beam: the words roll and the lamp swings ---------- */
.cta .book{display:inline-block;text-decoration:none;color:#ECE8E0}

.rw{display:inline-block;white-space:nowrap;vertical-align:top}

/* ---------- partner with us ---------- */
/* the four ways in as a staircase of rounded steps rising left to right, with a small gap
   between them. Consulting to negotiations is a small step on the light ground, the jump to
   advisory is big and the ground turns dark, partnership is the top step. Each grows a
   little under the pointer. */
.stairs{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:10px;margin-inline:calc(min(64px,4.4vw) * -1);padding-top:clamp(36px,4vw,64px)}
/* the arrow over the ladder: rising left to right, drawn on as you reach it */
.stairs-up{position:absolute;left:4%;top:0;width:92%;height:clamp(150px,17vw,230px);pointer-events:none;fill:none;stroke:#0A7261;stroke-width:9;stroke-linecap:butt;stroke-linejoin:miter}
.stairs-up path{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.6s var(--out)}
.stairs-up.up path{stroke-dashoffset:0}
@media (max-width:1000px){.stairs-up{display:none}.stairs{padding-top:0}}
.step{display:flex;flex-direction:column;gap:14px;padding:clamp(26px,2.6vw,40px) clamp(20px,2vw,32px) clamp(30px,3vw,44px);border-radius:16px;position:relative;
  transition:scale .5s var(--out),box-shadow .5s var(--out);transform-origin:50% 100%}
.step:hover{scale:1.03;z-index:2;box-shadow:0 30px 60px -30px rgba(10,30,26,.45)}
/* every card ends on the same call, pinned to its foot so the three line up */
.step__go{margin-top:auto;padding-top:10px}
.step--1{background:#E6EBE9;margin-top:clamp(140px,13vw,190px)}
.step--2{background:#E6EBE9;margin-top:clamp(70px,6.6vw,96px)}
.step--3{background:#161616;margin-top:0;color:#ECE8E0;--sub:#B9B5AE;--mute:#8E8A84;--rim:#2C2C2C;--fg:#ECE8E0;--bg:#0A0A0A;--bg2:#222}
.step--3:hover{box-shadow:0 0 0 1px rgba(45,226,195,.5),0 0 40px rgba(45,226,195,.45),0 30px 70px -20px rgba(45,226,195,.35)}
.step h3{font:400 clamp(22px,1.9vw,30px)/.95 var(--display);text-transform:uppercase;letter-spacing:-.02em;margin:0}
.step .step__for{margin:-6px 0 0;font:600 13px/1.45 var(--body);color:var(--mute)}
.step .step__for .mark{color:#0A0A0A;background-size:100% 100%;font-weight:600}
.step--3 .step__for{line-height:1.8}
.step--3 .step__for .mark{padding:.22em .4em .26em}
.step .step__lbl{margin:2px 0 -6px;font:600 11.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.step--3 h3 .mark{color:#0A0A0A;font-weight:400;background-size:100% 100%;padding:.06em .18em}
.seg{display:inline-flex;padding:4px;border-radius:100px;background:var(--bg2);gap:2px;margin-top:20px}
.seg button{border:0;background:none;padding:9px 14px;border-radius:100px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--sub);transition:.3s}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.step .seg{margin:0;align-self:stretch;display:flex;max-width:100%;background:#FFFFFF;box-shadow:inset 0 0 0 1.5px var(--rim)}
.step .seg button{flex:1;min-width:0;padding:7px 4px;font-size:12.5px}
.step > p{margin:0;font-size:15.5px;line-height:1.55;color:var(--sub)}
.step ol{list-style:none;margin:0;padding:14px 0 0;border-top:1px solid var(--rim);display:grid;gap:9px}
.step li{position:relative;padding-left:18px;font-size:14.5px;color:var(--sub);line-height:1.4}
.step li::before{content:"";position:absolute;left:1px;top:.58em;width:5px;height:5px;border-radius:50%;background:var(--mute)}
.step li.plus::before{content:"+";background:none;width:auto;height:auto;border-radius:0;left:0;top:0;font-weight:700;color:#0A7261}
.step--3 li.plus::before{color:#2DE2C3}
.step li.sep{display:flex;align-items:center;gap:12px;padding:4px 0 0;color:#0A7261;font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase}
.step--3 li.sep{color:#2DE2C3}
.step li.sep::before,.step li.sep::after{content:"";position:static;width:auto;height:1px;border-radius:0;background:var(--rim);flex:1}
@media (max-width:1000px){.stairs{grid-template-columns:repeat(2,minmax(0,1fr));margin-inline:0}.step--1{margin-top:60px}.step--2{margin-top:30px}.step--3{margin-top:0;grid-column:1/-1}}

.runrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(24px,3.4vw,56px);align-items:center;margin-top:clamp(44px,5.5vw,80px)}

@media (max-width:900px){.runrow{grid-template-columns:minmax(0,1fr)}}
.sr3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.srcard{background:var(--card);border-radius:16px;padding:clamp(22px,2.4vw,32px);box-shadow:0 0 0 1px var(--rim)}

.srcard h3{font:400 clamp(20px,1.9vw,27px)/1 var(--display);text-transform:uppercase;letter-spacing:-.02em;margin:14px 0 10px}

@media (max-width:760px){.sr3{grid-template-columns:minmax(0,1fr)}}
.ticks.ticks--sr{grid-template-rows:repeat(2,auto)}

.offer{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr) minmax(0,3fr);gap:clamp(24px,4vw,64px);padding:clamp(36px,4vw,56px) 0;border-top:1px solid var(--rim);align-items:start}

.offer .row{justify-content:flex-end}
@media (max-width:900px){.offer{grid-template-columns:1fr}.offer .row{justify-content:flex-start}}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:clamp(28px,3vw,40px)}
.vs > div{padding:26px;border-radius:20px;background:var(--card)}
.vs > div:last-child{background:var(--black);color:#ECE8E0}

.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

@media (max-width:900px){.trio{grid-template-columns:minmax(0,1fr)}}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rim)}
.cols3 > div{padding:30px 30px 0 0}
.cols3 > div + div{padding-left:30px;border-left:1px solid var(--rim)}
.cols3 h3{font:600 clamp(19px,1.5vw,22px)/1.25 var(--body);margin:0 0 12px}
.cols3 p{margin:0;color:var(--sub);font-size:16px}
@media (max-width:900px){.cols3{grid-template-columns:1fr}.cols3 > div + div{padding-left:0;border-left:0;border-top:1px solid var(--rim);margin-top:30px}}
.cal{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rim);border-radius:12px;background:var(--card);overflow:hidden}
.cal::before{content:"";position:absolute;left:0;top:0;height:3px;width:0;background:var(--acc);transition:width 1.6s var(--out);z-index:1}
.cal.on::before{width:100%}
.cal__c + .cal__c{border-left:1px solid var(--rim)}

.cal__t{display:block;height:12px;border-bottom:1px solid var(--rim);background:repeating-linear-gradient(90deg,var(--rim) 0 1px,transparent 1px 10%)}

@media (max-width:900px){.cal{grid-template-columns:minmax(0,1fr)}.cal__c + .cal__c{border-left:0;border-top:1px solid var(--rim)}}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.day{padding:26px;border-radius:20px;background:var(--card);display:flex;flex-direction:column;gap:10px}

.day.on .day__n{color:var(--acc-t)}

.day.on .day__bar i{width:100%}
.days .day:nth-child(2) .day__bar i{transition-delay:.25s}.days .day:nth-child(3) .day__bar i{transition-delay:.5s}.days .day:nth-child(4) .day__bar i{transition-delay:.75s}
.day h3{font:600 18px/1.25 var(--body);margin:0}
.day p{margin:0;font-size:15px;color:var(--sub)}

@media (max-width:620px){.days{grid-template-columns:1fr}}

/* the 4 pillars, as on Ryan's poster: plain dark cards, each with its number big behind it */
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.pil{position:relative;overflow:hidden;text-align:left;padding:28px 26px;border-radius:18px;border:1px solid #232323;background:#111;cursor:pointer;
  display:flex;flex-direction:column;gap:14px;min-height:340px;color:#ECE8E0;transition:border-color .4s,background .4s}
.pil::after{content:attr(data-n);position:absolute;right:-.04em;bottom:-.16em;z-index:0;pointer-events:none;
  font:400 clamp(180px,17vw,280px)/1 'Archivo Black',Impact,sans-serif;
  background:linear-gradient(to top,rgba(45,226,195,.42),rgba(45,226,195,.12) 55%,rgba(45,226,195,0) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity .4s}
.pil > *{position:relative;z-index:1}
.pil h3{font:400 clamp(20px,1.6vw,24px)/1 var(--display);text-transform:uppercase;margin:0;color:#2DE2C3}
.pil p{margin:0;font-size:15px;line-height:1.55;color:#B9B5AE}
.pil:hover{border-color:rgba(45,226,195,.45)}
.pil[aria-pressed="true"]{border-color:#2DE2C3;background:#0F1A18}
.pil[aria-pressed="true"]::after{background:linear-gradient(to top,rgba(45,226,195,.75),rgba(45,226,195,.2) 55%,rgba(45,226,195,0) 85%);-webkit-background-clip:text;background-clip:text}
@media (max-width:900px){.pills{grid-template-columns:1fr 1fr}.pil{min-height:280px}}
@media (max-width:520px){.pills{grid-template-columns:1fr}.pil{min-height:220px}}

/* the engine: Ryan's drawing, extra large, with a box to type into over every metric.
   CAC, AOGP and LTGP work themselves out, and the result sits in the empty corner. */
/* sized so the whole drawing fits one screen */
.eng{width:min(100%,calc((100svh - 150px) * 2290 / 2160));margin:0 auto;container-type:inline-size}
.eng__art{position:relative;border-radius:24px;overflow:hidden;background:#fff;aspect-ratio:2290/2160;box-shadow:0 40px 80px -40px rgba(10,30,26,.35)}
.eng__art > img{width:100%;height:100%;object-fit:cover}
.nb{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 .9em;border-radius:12px;background:#fff;
  border:1.5px solid #B9C2C0;color:#111614;font-size:1.08cqw;cursor:text;transition:border-color .3s,box-shadow .3s}
.nb span{font:600 .78em/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:#6B7471;white-space:nowrap}
.nb b{display:flex;align-items:baseline;gap:.2em;font:700 1.35em/1 var(--body)}
.nb em{font-style:normal;font-weight:500;color:#6B7471;font-size:.8em}
.nb input{width:100%;min-width:0;border:0;background:none;outline:none;padding:0;font:inherit;color:inherit;-moz-appearance:textfield}
.nb input::-webkit-outer-spin-button,.nb input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.nv .nb input:focus-visible{outline:none}
.nb:hover{border-color:#0A7261}
.nb:focus-within{border-color:#0A7261;box-shadow:0 0 0 4px rgba(45,226,195,.35),0 0 24px rgba(45,226,195,.5)}
.nb--out{background:#E6FBF6;border-color:#2DE2C3;cursor:default}
.nb--out output{font:400 1.4em/1 var(--display);color:#0A7261}
.out{position:absolute;left:3%;top:3%;width:28%;border-radius:1.4cqw;background:var(--black);color:#ECE8E0;padding:1.6cqw;display:grid;gap:.7cqw}
.out__big{font:400 4.6cqw/1 var(--display)}
.out p{margin:0;color:#B9B5AE;font-size:clamp(12px,1vw,15px)}
.out__state{justify-self:start;display:inline-block;padding:7px 12px;border-radius:100px;font-weight:600;font-size:clamp(11px,.9vw,14px);background:#262626}
.out__state.up{background:#2DE2C3;color:#0A0A0A}
.out__state.down{background:#FF5A36;color:#0A0A0A}
.eng__note{margin:18px 0 0;color:var(--mute);text-align:center}
/* on a phone the boxes are too small to type in on the drawing, so they line up under it */
@media (max-width:900px){
  .eng{width:auto;left:0;translate:none}
  .eng__art{aspect-ratio:auto;overflow:visible;background:none;box-shadow:none}
  .eng__art > img{height:auto;border-radius:18px;background:#fff}
  .out{position:static;width:auto;margin-top:12px;padding:18px;gap:8px;border-radius:16px}
  .out__big{font-size:44px}.out p{font-size:14px}
  .eng__nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* are we a fit */

/* The signature writes itself. Each glyph is masked by pen strokes traced down its centre
   line, drawn in writing order at one pen speed, with a short lift between letters. Black
   cover strokes keep the l hidden until its turn, because it shares a shape with the T.
   The pen runs at 85 percent of the stroke width so it never uncovers the inside of a
   loop. A second full width pen follows 0.1s behind it and fades in over 0.6s, so each

   pens missed. --k

.sig--draw .pen-cover,.curtain.to-ryan.on .curtain__sig .pen-cover{opacity:1}

/* his pink, the way his buttons wear it: a vignette, and the pure pink as a ring just inside */
.pink{position:relative;background:#FF2D6B;color:#0A0A0A;box-shadow:inset 0 0 160px 10px rgba(0,0,0,.34);
  --fg:#0A0A0A;--sub:rgba(10,10,10,.8);--mute:rgba(10,10,10,.62);--rim:rgba(10,10,10,.2);--acc:#0A0A0A}
.pink--ring::after{content:"";position:absolute;inset:8px;border:2px solid #FF2D6B;border-radius:inherit;pointer-events:none}
.pinkband{padding:clamp(96px,11vw,160px) 0}
/* Ryan cut out on the right, standing in the band; the heading and the copy run over his edge */
.pinkband--me{overflow:hidden;isolation:isolate}
.pinkband__me{position:absolute;right:0;bottom:0;height:min(92%,860px);max-width:58vw;object-fit:contain;object-position:right bottom;width:auto;z-index:0;pointer-events:none;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.35))}
.pinkband--me .wrap{z-index:2}
.pinkband__me{translate:60% 0;opacity:0;transition:translate 1.3s var(--out),opacity .6s}
.pinkband__me.up{translate:0 0;opacity:1}
.pinkband--me .big{text-shadow:0 4px 30px rgba(255,45,107,.35)}
.pinkband__copy{max-width:min(640px,58%)}
.pinkband__copy .p{font-size:clamp(17px,1.3vw,20px);font-weight:500;color:#0A0A0A}
.pinkband .hand{color:#fff;margin-bottom:22px;translate:0 -10px}
@media (max-width:900px){.pinkband--me{padding-bottom:min(118vw,620px)}.pinkband__me{right:0;height:min(110vw,560px);max-width:none}.pinkband__copy{max-width:none}}
.big{font:400 clamp(64px,11vw,184px)/.86 'Anton',Impact,sans-serif;text-transform:uppercase;margin:0}
.ways{border-top:1px solid var(--rim)}
.ways > div{display:grid;grid-template-columns:80px minmax(0,1fr) minmax(0,1.1fr) 180px;gap:28px;align-items:center;padding:clamp(28px,3vw,40px) 0;border-bottom:1px solid var(--rim);transition:padding .5s var(--out)}
.ways > div{position:relative;isolation:isolate}
.ways > div::before{content:"";position:absolute;inset:6px -46px 6px -38px;z-index:-1;rotate:-.75deg;
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20200%2040%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20fill%3D%22%23FF2D6B%22%20d%3D%22M7%204%20Q3%204%203%209%20L2%2032%20Q2%2037%207%2037%20L191%2035%20Q196%2035%20196%2030%20L197%2012%20Q197%208%20192%208%20Z%22/%3E%3C/svg%3E") 0 0 / 100% 100% no-repeat;
  transform-origin:left center;scale:0 1;transition:scale .26s cubic-bezier(.3,0,.1,1)}
/* each row's stroke sits a little differently: flipped top to bottom, or the heavy end
   swapped to the other side, so no two rows wear the same mark. All still sweep left to right. */
.ways > div:nth-child(2)::before{rotate:.8deg;scale:0 -1}
.ways > div:nth-child(2):hover::before{scale:1 -1}

.ways > div:nth-child(4)::before{rotate:.7deg;scale:0 -1;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20200%2040%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20fill%3D%22%23FF2D6B%22%20d%3D%22M8%208%20Q3%208%203%2013%20L4%2030%20Q4%2035%209%2035%20L192%2037%20Q197%2037%20197%2032%20L198%209%20Q198%204%20193%204%20Z%22/%3E%3C/svg%3E")}

            <p class="copy">If you get 3 quotes, take the cheapest, squeeze a bit more out of it, and repeat next event. You are doing it wrong!</p>

          <p class="p"><strong>Why Partnerships?</strong></p>
          <p class="p">We believe partnering makes you more money compared to any other strategy in this industry, and it makes your life easier while you&rsquo;re at it.</p>
          <p class="p">We&rsquo;re here to teach you how to do it, using our 4 pillars of partnership&trade; framework.</p>
          <p class="p">What is a partnership? Simply a deal between two businesses that benefits both of them, allowing them to grow faster together than on their own.</p>

        <div class="cases cases--res">
          <article class="case fade"><h3>12 months booked out at once</h3><p>We put a partnership together between an events company and a venue. Instead of negotiating event by event, we negotiated the whole year at once. Better rates for the events company, and a year booked out for the venue.</p><div class="nums"><div><b data-count="750" data-pre="$" data-suffix="k">$750k</b><span>Booked out for the venue</span></div><div><b data-count="80" data-pre="$" data-suffix="k">$80k</b><span>Saved by the events company</span></div></div></article>
          <article class="case fade"><h3>Serving their clients better with 0 effort</h3><p>We built a referral partnership between a production company and a video studio, so the production company could offer video to its own clients, and the studio picked up work it never had to chase.</p><div class="nums"><div><b data-count="2000" data-pre="$">$2,000</b><span>Extra per event for the production company</span></div><div><b data-count="2">2</b><span>New jobs a month for the studio</span></div></div></article>
          <article class="case fade"><h3>A better rate for a bigger commitment</h3><p>We put an event management company and an AV hire business on one deal instead of pricing job by job. Five events locked in at once, at better rates for both sides.</p><div class="nums"><div><b data-count="500" data-pre="$" data-suffix="k">$500k</b><span>Locked in for the AV business</span></div><div><b data-count="125" data-pre="$" data-suffix="k">$125k</b><span>Saved by the event company</span></div></div></article>

      <div class="wrap">
        <div class="sh"><h2 class="d d2" data-split>Questions we get asked</h2></div>
        <div class="faq2">
        <div class="faq" data-faq>
          <div class="q"><button type="button" aria-expanded="false">What does it cost?<i></i></button><div class="q__a"><div><p>Consulting &amp; advisory and implementation are paid services, with implementation priced per deal. Partnering costs nothing upfront, because we take a minority equity stake instead. Either way, you&rsquo;ll have full numbers before anything is signed.</p></div></div></div>
          <div class="q"><button type="button" aria-expanded="false">How do you grow a live events business?<i></i></button><div class="q__a"><div><p>Through partnerships and optimisation. The right partnerships create revenue, margin, reach and connection faster than anything else in this industry, and the optimisation engine&trade; finds the profit already hiding in your numbers.</p></div></div></div>
          <div class="q"><button type="button" aria-expanded="false">What is a business partnership in live events?<i></i></button><div class="q__a"><div><p>A deal between two businesses in the industry that creates something for both sides: revenue, margin, reach or connection. We map them with the 4 pillars of partnership&trade;, and a good one creates one of the four for you and one for the other party.</p></div></div></div>
          <div class="q"><button type="button" aria-expanded="false">What are the 4 pillars of partnership?<i></i></button><div class="q__a"><div><p>Revenue, margin, reach and connection. They&rsquo;re Ryan Tayler&rsquo;s framework for finding partnerships: every good partnership creates at least one of the four for you, and one for the other side. We map every potential partner in your business against them.</p></div></div></div>
          <div class="q"><button type="button" aria-expanded="false">What happens in a consulting &amp; advisory session?<i></i></button><div class="q__a"><div><p>A one hour session, weekly, fortnightly or monthly. Each session focuses on one of revenue, margin, reach, connection or optimisation, depending on where your business is at, and you leave with exact partners or optimisations to act on before the next one.</p></div></div></div>
          <div class="q"><button type="button" aria-expanded="false">Do you only work with live events &amp; production businesses?<i></i></button><div class="q__a"><div><p>Yes. We work with founder operated live events &amp; production businesses turning over $1m to $10m. That focus is the point: we know the market, the suppliers and the partners worth knowing.</p></div></div></div>
        </div>
        <div class="faq" data-faq>
          <div class="q"><button type="button" aria-expanded="false">How much of my business do you take?<i></i></button><div class="q__a"><div><p>None, unless we partner. Consulting &amp; advisory and implementation are straight services. In a partnership we take a minority equity stake, sized per business and per deal, negotiated case by case.</p></div></div></div>
          <div class="q"><button type="button" aria-expanded="false">Do I stop running my business?<i></i></button><div class="q__a"><div><p>That&rsquo;s up to you. We&rsquo;ve helped owner operators improve their business and stay as the sole operator. We&rsquo;ve helped owners place in a general manager while still owning their business, and we&rsquo;ve simply helped owners exit entirely. The outcome is up to you.</p></div></div></div>
          <div class="q"><button type="button" aria-expanded="false">What happens to my team?<i></i></button><div class="q__a"><div><p>In most cases nothing! The team is the team and we continue business as usual while we focus on growth.</p></div></div></div>
          <div class="q"><button type="button" aria-expanded="false">How many partners do you take on?<i></i></button><div class="q__a"><div><p>We want to throw our entire focus into each partnership, so we only take on 1 primary partner every 60 days. This limits our availability to only 6 partnerships per year, and nets the best result.</p></div></div></div>
          <div class="q"><button type="button" aria-expanded="false">Who runs Headliner Group?<i></i></button><div class="q__a"><div><p>Ryan Tayler. He&rsquo;s spent his career building partnerships in the live events industry: more than 115 live events delivered for over 56,000 attendees, and partnerships that have generated $2.5 million for the businesses involved. Headliner Group is how he does it for others.</p></div></div></div>
          <div class="q"><button type="button" aria-expanded="false">What is the optimisation engine?<i></i></button><div class="q__a"><div><p>Ryan Tayler&rsquo;s framework for finding what to optimise in a business. It maps your business as an engine &mdash; marketing brings clients in, you do the work, the clients you impress come back, buy again and refer &mdash; and puts your numbers on every step, so the biggest impact optimisations show themselves.</p></div></div></div>
        </div>

    mqAnims.forEach(function(a){ a.playbackRate+=((1+Math.min(6,Math.abs(vel)*.25))-a.playbackRate)*.08; }); vel*=.9;
  }
  function frame(){ tick(); requestAnimationFrame(frame); }

  function wake(page){
    $$('[data-split]',page).forEach(split); $$('[data-roll]',page).forEach(roll);
    var sig=$('[data-sig]',page); if(sig){ sig.classList.remove('sig--draw'); void sig.offsetWidth; sig.classList.add('sig--draw'); }
    $$('.dk .lever,.dk .slot,.dk .pil,.dk .case,.dk .tally',page).forEach(function(c){ c.classList.add('glint'); });
    marquee(page); engine();
    var last=page.lastElementChild; while(last && last.tagName!=='SECTION') last=last.previousElementSibling;
    nv.classList.toggle('ends-dark', !!last && last.classList.contains('dk'));
    requestAnimationFrame(function(){ requestAnimationFrame(tick); });
  }

  /* pillars pick the case studies */
  function pick(name){
    $$('.pil').forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.pillar===name)); });
    $$('.pg[data-pg="partnerships"] .case').forEach(function(c){ var has=!name||c.dataset.pillars.split(' ').indexOf(name)>-1;
      c.classList.toggle('is-off',!has); c.classList.toggle('is-match',!!name&&has); $$('.tag',c).forEach(function(t){ t.classList.toggle('hit',t.dataset.t===name); }); });
  }
  $$('.pil').forEach(function(b){ b.addEventListener('click',function(){ pick(b.getAttribute('aria-pressed')==='true'?'':b.dataset.pillar); }); });

  /* the stacked photos swap round each other every so often while on screen */
  var BACK={translate:'3% 2.5%',rotate:'2.5deg',scale:'.95',filter:'brightness(.55)'}, TOP={translate:'0% 0%',rotate:'0deg',scale:'1',filter:'brightness(1)'};
  setInterval(function(){
    if(!current||!live()||reduce) return;
    $$('[data-slider]',current).forEach(function(sl){
      var r=sl.getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
      var ims=$$('.sl',sl), i=ims.findIndex(function(m){ return m.classList.contains('is-shown'); }), a=ims[i], b=ims[(i+1)%ims.length];
      ims.forEach(function(m){ m.getAnimations().forEach(function(x){ x.cancel(); }); });
      var out={duration:560,easing:'cubic-bezier(.55,0,.85,.35)',fill:'forwards'};
      a.animate([TOP,{translate:'-22% -2%',rotate:'-7deg',scale:'.97',filter:'brightness(.85)'}],out);
      b.animate([BACK,{translate:'22% -1%',rotate:'7deg',scale:'.99',filter:'brightness(.95)'}],out).onfinish=function(){
        a.classList.remove('is-shown'); b.classList.add('is-shown');
        var back={duration:1050,easing:'cubic-bezier(.1,.65,.2,1)',fill:'forwards'};
        b.animate([{translate:'22% -1%',rotate:'7deg',scale:'.99',filter:'brightness(.95)'},TOP],back);
        a.animate([{translate:'-22% -2%',rotate:'-7deg',scale:'.97',filter:'brightness(.85)'},BACK],back).onfinish=function(){ ims.forEach(function(m){ m.getAnimations().forEach(function(x){ x.cancel(); }); }); };
      };
    });
  },7400);

  /* the fan reacts to the pointer only while it moves over it: each card nearby gets a nudge
     in the direction of travel, springs back, and is still again once the pointer stops */
  (function(){
    var cards=[], st=[], raf=0;
    function run(){
      var live=false;
      cards.forEach(function(c,k){ var q=st[k]; q.v+=-q.a*.1; q.v*=.55; q.a+=q.v; q.yv+=-q.y*.1; q.yv*=.55; q.y+=q.yv;
        if(Math.abs(q.a)+Math.abs(q.v)+Math.abs(q.y)+Math.abs(q.yv)>.01) live=true; else { q.a=q.v=q.y=q.yv=0; }
        c.style.setProperty('--rr',q.a.toFixed(3)+'deg'); c.style.setProperty('--ry',q.y.toFixed(2)+'px'); });
      raf=live?requestAnimationFrame(run):0;
    }
    nv.addEventListener('pointermove',function(e){
      var f=e.target.closest&&e.target.closest('.fan'); if(!f||reduce) return;
      cards=$$('.fan__c',f); while(st.length<cards.length) st.push({a:0,v:0,y:0,yv:0});
      var mx=e.movementX||0, my=e.movementY||0;
      cards.forEach(function(c,k){ var r=c.getBoundingClientRect(), d=Math.abs(e.clientX-(r.left+r.width/2)), w=Math.max(0,1-d/(r.width*1.3));
        st[k].v+=Math.max(-.055,Math.min(.055,mx*.0026))*w; st[k].yv+=Math.max(-.1,Math.min(.1,-Math.abs(mx)*.0032-my*.0016))*w; });
      if(!raf) raf=requestAnimationFrame(run);
    },{passive:true});
  })();


  /* the engine, on your numbers: CAC from the funnel, AOGP from the order, LTGP from
     the purchases, and the ratio Ryan's worksheet aims at, 3 : 1 or better */
  function engine(){
    var box=$('[data-eng]'); if(!box) return;
    function v(k){ var x=parseFloat($('[data-n="'+k+'"]',box).value); return isNaN(x)||x<0?0:x; }
    function $f(n){ return '$'+Math.round(n).toLocaleString('en-AU'); }
    var conv=(v('show')/100)*(v('close')/100), cac=conv?v('cpl')/conv:0, aogp=v('aov')*v('gm')/100, ltgp=aogp*v('buys'), ratio=cac?ltgp/cac:0;
    $('[data-o="cac"]',box).textContent=$f(cac); $('[data-o="aogp"]',box).textContent=$f(aogp); $('[data-o="ltgp"]',box).textContent=$f(ltgp);
    $('[data-e-ratio]').textContent=(ratio>=10?Math.round(ratio):ratio.toFixed(1))+' : 1';
    var st=$('[data-e-state]'); st.className='out__state '+(!cac?'':ratio>=3?'up':'down');
    st.textContent=!cac?'Aim for 3 : 1 or better':ratio>=3?'Healthy, 3 : 1 or better':'Under 3 : 1';
  }
  $$('[data-eng] input').forEach(function(i){ i.addEventListener('input',engine); });

  /* are we a fit */
  $$('[data-fitbox]').forEach(function(fb){ var box=$('[data-fit]',fb), a=$('[data-fit-a]',fb), t=$('[data-fit-t]',fb), p=$('[data-fit-p]',fb), go=$('[data-fit-go]',fb), bg=a.style.background;
    $$('.tog',box).forEach(function(b){ b.addEventListener('click',function(){
      b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));
      var n=$$('.tog[aria-pressed="true"]',box).length;
      a.classList.toggle('yes',n===6); a.style.background=n===6?'':bg; go.hidden=n<6;
      if(n===6){ t.textContent=fb.dataset.yes||'Sounds like a fit'; p.textContent='Book a call and we\u2019ll work out which of the four ways suits your business.'; }
      else if(n===0){ t.textContent='Tick what\u2019s true'; p.textContent='We work best with profitable, founder operated businesses in or around live events and production, doing $1m to $10m and looking to grow or exit.'; }
      else { t.textContent='Maybe not a long-term fit'; p.textContent='A long-term partnership needs all six. Consulting and the free tools could still help.'; }
    }); });
  });

  $$('[data-faq] .q button').forEach(function(b){ b.addEventListener('click',function(){ var q=b.parentNode, o=!q.hasAttribute('data-open'); q.toggleAttribute('data-open',o); b.setAttribute('aria-expanded',String(o)); }); });

  var sheet=$('[data-sheet]'), lastFocus=null;
  $$('[data-wall] .res').forEach(function(card){ card.addEventListener('click',function(){
    var t=$('template[data-detail="'+card.dataset.open+'"]'); if(!t) return;
    var img=$('img',card); $('[data-sheet-img]').innerHTML=img?'<img alt="" src="'+img.getAttribute('src')+'">':'<div class="res__soon">Coming soon</div>';
    var b=$('[data-sheet-body]'); b.innerHTML=''; b.appendChild(t.content.cloneNode(true));
    lastFocus=card; sheet.classList.add('is-open'); sheet.setAttribute('aria-hidden','false'); setTimeout(function(){ $('[data-close]').focus(); },60);
  }); });
  function closeSheet(){ if(!sheet||!sheet.classList.contains('is-open')) return; sheet.classList.remove('is-open'); sheet.setAttribute('aria-hidden','true'); if(lastFocus) lastFocus.focus(); }
  if(sheet) sheet.addEventListener('click',function(e){ if(e.target===sheet||e.target.closest('[data-close]')) closeSheet(); });
  addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeSheet(); closeDrawer(); } });
  nv.addEventListener('submit',function(e){ var f=e.target.closest('form[data-demo]'); if(!f) return; e.preventDefault(); f.classList.add('is-done'); });

  /* the home hero lockup flies up into the header as you scroll; the header logo
     waits empty until it lands */
  (function(){
    var link=$('.hl-link'), out=$('.pg[data-pg="index"] .hero__logo'), st=out&&out.querySelector('.hl-stage');
    if(!link||!st) return;
    var clone=st.cloneNode(true); clone.classList.add('hl-fly'); clone.style.display='none'; nv.appendChild(clone);
    function go(){
      var onHome=current&&current.dataset.pg==='index'&&!reduce;
      if(!onHome){ link.style.opacity=''; clone.style.display='none'; st.style.visibility=''; }
      else{
        var t=Math.min(1,Math.max(0,scrollY/(innerHeight*.5)));
        if(t<=.001){ link.style.opacity='0'; clone.style.display='none'; st.style.visibility=''; clone._a=null; }
        else if(t>=.999){ link.style.opacity='1'; clone.style.display='none'; st.style.visibility='hidden'; }
        else{
          /* The start is frozen in page space on the first flight frame. Reading the live
             rect every frame made the path wobble, because the hero slides at half the
             scroll while the flight is going. The hero moves at half scroll, so the start
             drifts down screen at half the delta. */
          if(!clone._a){ var r0=st.getBoundingClientRect(); clone._a={l:r0.left,t:r0.top,w:r0.width,y:scrollY};
            clone.style.fontSize=getComputedStyle(st).fontSize; }
          st.style.visibility='hidden'; link.style.opacity='0'; clone.style.display='flex';
          /* On a phone the lockup starts at the top centre, so it holds its height and
             glides into the bar's corner; on a wide screen it rides the hero up at half
             the scroll, as the live rect used to. */
          var hold=innerWidth<=620?0:.5;
          var A=clone._a, at=A.t-(scrollY-A.y)*hold, b=link.getBoundingClientRect(), e=t*t*(3-2*t);
          clone.style.translate=(A.l+(b.left-A.l)*e).toFixed(1)+'px '+(at+(b.top-at)*e).toFixed(1)+'px';
          clone.style.scale=(1+((b.width/A.w)-1)*e).toFixed(4);
        }
      }
      requestAnimationFrame(go);
    }
    go();
  })();

  root.host.nvShow=function(name){ show(name||'index',false); };
  requestAnimationFrame(frame);
})(this);
</script>

</template>

<script>
/* The view mounts in a shadow root, so nothing outside can reach its styles and its
   styles reach nothing outside. No switch: this is the site. */
(function(){
  var src=document.getElementById('nv-src'); if(!src||!document.body.attachShadow) return;
  var host=document.createElement('div'); host.id='nv-host';
  document.body.appendChild(host);
  var root=host.attachShadow({mode:'open'}), frag=src.content.cloneNode(true);
  var sc=frag.querySelector('script[data-nv]'), code=sc?sc.textContent:''; if(sc) sc.remove();
  root.appendChild(frag);
  try{ (new Function(code)).call(root); }catch(e){ console.error('view', e); }
  var at=(location.hash||'#index').slice(1)||'index';
  if(host.nvShow) host.nvShow(at);
})();
</script>
